<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HeatSync</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<h1>🔥 HeatSync</h1>

<p class="subtitle">
Outdoor Rotation Manager
</p>


<!-- SETUP -->

<div class="card" id="setupCard">

<h2>Today's Rotation</h2>

<div class="timer-buttons">

<button onclick="setRotation(45)">
45 MIN
</button>

<button onclick="setRotation(30)">
30 MIN
</button>

<button onclick="setRotation(20)">
20 MIN
</button>

</div>


<p id="rotationDisplay">
Current Rotation: 45 Minutes
</p>

</div>




<div class="card" id="teamSetup">

<h2>Set Shift Team</h2>

<div id="positions"></div>

</div>




<button class="start-button" onclick="startShift()">
START SHIFT
</button>





<!-- DASHBOARD -->

<div id="dashboard" style="display:none;">


<div class="card">

<h2>
🔥 HeatSync Dashboard
</h2>


<p id="dashboardRotation">
Current Rotation: 45 Minutes
</p>



<h3>
🔥 Rotation Control
</h3>


<div class="timer-buttons">

<button onclick="changeShiftRotation(45)">
45 MIN
</button>

<button onclick="changeShiftRotation(30)">
30 MIN
</button>

<button onclick="changeShiftRotation(20)">
20 MIN
</button>

</div>



<p id="rotationMessage">
New switches will use this time.
</p>




<div class="timer-buttons">

<button onclick="pauseTimers()">
⏸ PAUSE ALL
</button>


<button onclick="resumeTimers()">
▶ RESUME
</button>

</div>



<p id="pauseMessage">
🔥 HEATSYNC ACTIVE
</p>




<!-- NEEDS ATTENTION BANNER -->

<div id="attentionBanner">

✅ ALL ROTATIONS ON TRACK

</div>



</div>




<div id="dashboardPositions"></div>



</div>



</div>


<script src="app.js"></script>

</body>

</html>
